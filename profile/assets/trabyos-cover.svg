<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">TrabyOS — voice-first AI trading on macOS, with explicit approval before every order</title>
  <desc id="description">A dark graphite product banner showing a spoken command becoming an order card that waits for the user to approve it.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.54" stop-color="#0e1219"/>
      <stop offset="1" stop-color="#1a2433"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff0d0"/>
      <stop offset="1" stop-color="#22b894"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2fd6ab" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2fd6ab" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1004" cy="78" r="300" fill="url(#glow)"/>
  <path d="M0 348 C204 294 360 404 600 346 C820 289 1010 360 1200 300 L1200 420 L0 420 Z" fill="#030407" fill-opacity="0.56"/>

  <g font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="72" y="60" width="336" height="38" rx="19" fill="#2fd6ab" fill-opacity="0.14" stroke="#7ff0d0" stroke-opacity="0.55"/>
    <circle cx="93" cy="79" r="5" fill="#ffc46b"/>
    <text x="108" y="85" fill="#cdf2e7" font-size="15" font-weight="700" letter-spacing="1.05">TEST MODE · NO REAL MONEY MOVES</text>

    <text x="70" y="190" fill="#ffffff" font-size="68" font-weight="760" letter-spacing="-2.4">Traby</text>
    <text x="253" y="190" fill="url(#accent)" font-size="68" font-weight="760" letter-spacing="-2.4">OS</text>
    <text x="74" y="241" fill="#c8cedb" font-size="24" font-weight="520">Say it. See the card. Approve it out loud.</text>
    <text x="74" y="284" fill="#8590a3" font-size="17">Voice-first trading on macOS · live prices · nothing executes unasked</text>
  </g>

  <g transform="translate(640,104)" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect x="0" y="52" width="92" height="56" rx="16" fill="url(#glass)" stroke="#7ff0d0" stroke-opacity="0.45"/>
      <path d="M46 68 v14" stroke="#7ff0d0" stroke-width="5" stroke-linecap="round"/>
      <path d="M34 74 v4 M58 74 v4" stroke="#7ff0d0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
      <path d="M38 92 h16" stroke="#cdf2e7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65"/>
      <text x="46" y="130" fill="#7c8699" font-size="12" text-anchor="middle" letter-spacing="0.8">SPEAK</text>
    </g>

    <path d="M100 80 H140" fill="none" stroke="#7ff0d0" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>

    <g transform="translate(148,18)">
      <rect x="0" y="0" width="238" height="128" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.22"/>
      <rect x="0" y="0" width="238" height="128" rx="22" fill="#0d1520" fill-opacity="0.55"/>
      <text x="20" y="32" fill="#8590a3" font-size="12" letter-spacing="1.4">ORDER · WAITING</text>
      <text x="20" y="64" fill="#ffffff" font-size="21" font-weight="700">BUY 0.001 BTC</text>
      <text x="20" y="88" fill="#7ff0d0" font-size="14" font-weight="600">Binance spot · market</text>
      <rect x="20" y="100" width="86" height="14" rx="7" fill="#22b894" fill-opacity="0.28" stroke="#7ff0d0" stroke-opacity="0.55"/>
      <rect x="116" y="100" width="58" height="14" rx="7" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2"/>
      <path d="M186 96 l10 -14 l10 8 l12 -22" fill="none" stroke="#7ff0d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M394 80 H434" fill="none" stroke="#ffc46b" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>

    <g transform="translate(442,52)">
      <rect x="0" y="0" width="100" height="56" rx="16" fill="#1d2a22" stroke="#ffc46b" stroke-opacity="0.85"/>
      <path d="M26 30 l12 12 l24 -26" fill="none" stroke="#ffc46b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="78" fill="#7c8699" font-size="12" text-anchor="middle" letter-spacing="0.8">APPROVE</text>
    </g>
  </g>
</svg>
